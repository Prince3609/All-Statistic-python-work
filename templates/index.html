<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Job Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  </head>
  <body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
      <header class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
        <h1 class="text-2xl font-bold">Student Job Tracker</h1>
        <p class="text-sm text-slate-500 mt-1">Single-user dashboard for tracking student job progress and payments.</p>
      </header>

      <section
        id="metrics-container"
        hx-get="/partials/metrics"
        hx-trigger="load, refresh-metrics from:body"
        hx-swap="innerHTML"
        class="grid grid-cols-1 md:grid-cols-3 gap-4"
      >
      </section>

      <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
        <h2 class="text-lg font-semibold mb-4">Quick Add Job</h2>
        <form
          class="grid grid-cols-1 md:grid-cols-4 gap-3"
          hx-post="/jobs"
          hx-target="#table-container"
          hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful){this.reset(); document.getElementById('form-error').innerHTML='';}"
        >
          <input class="px-3 py-2 border rounded-lg" name="student_name" placeholder="Student Name" required />
          <input class="px-3 py-2 border rounded-lg" name="matric_number" placeholder="Matric Number" required />
          <input class="px-3 py-2 border rounded-lg" name="course_code" placeholder="Course Code" required />

          <select class="px-3 py-2 border rounded-lg" name="status">
            {% for status in status_values %}
            <option value="{{ status }}">{{ status }}</option>
            {% endfor %}
          </select>

          <select class="px-3 py-2 border rounded-lg" name="priority">
            {% for priority in priority_values %}
            <option value="{{ priority }}">{{ priority }}</option>
            {% endfor %}
          </select>

          <input class="px-3 py-2 border rounded-lg" type="number" min="0" step="0.01" name="fee_total" placeholder="Fee Total" required />
          <input class="px-3 py-2 border rounded-lg" type="number" min="0" step="0.01" name="fee_paid" placeholder="Fee Paid" value="0" required />
          <button class="bg-indigo-600 text-white rounded-lg px-4 py-2 font-medium hover:bg-indigo-700">Add Job</button>
        </form>
        <div id="form-error" class="mt-3 text-sm text-red-600">{% if error %}{{ error }}{% endif %}</div>
      </section>

      <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 overflow-x-auto">
        <h2 class="text-lg font-semibold mb-4">Jobs</h2>
        <div id="table-container">
          {% include "partials/table.html" %}
        </div>
      </section>
    </div>
  </body>
</html>
