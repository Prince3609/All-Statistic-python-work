<tr id="job-row-{{ job.id }}" class="hover:bg-slate-50">
  <td class="p-3 font-medium">{{ job.student_name }}</td>
  <td class="p-3">{{ job.matric_number }}</td>
  <td class="p-3">{{ job.course_code }}</td>

  <td class="p-3">
    <button
      class="px-2 py-1 rounded text-xs font-semibold
      {% if job.status.value == 'Completed' %}bg-green-100 text-green-700
      {% elif job.status.value == 'In Progress' %}bg-amber-100 text-amber-700
      {% else %}bg-slate-200 text-slate-700{% endif %}"
      hx-post="/jobs/{{ job.id }}/status"
      hx-target="#job-row-{{ job.id }}"
      hx-swap="outerHTML"
    >
      {{ job.status.value }}
    </button>
  </td>

  <td class="p-3">
    <button
      class="px-2 py-1 rounded text-xs font-semibold
      {% if job.priority.value == 'High' %}bg-red-100 text-red-700
      {% elif job.priority.value == 'Medium' %}bg-yellow-100 text-yellow-700
      {% else %}bg-blue-100 text-blue-700{% endif %}"
      hx-post="/jobs/{{ job.id }}/priority"
      hx-target="#job-row-{{ job.id }}"
      hx-swap="outerHTML"
    >
      {{ job.priority.value }}
    </button>
  </td>

  <td class="p-3 text-right">₦{{ '%.2f'|format(job.fee_total) }}</td>
  <td class="p-3 text-right">
    <form
      class="inline-flex items-center justify-end gap-1"
      hx-post="/jobs/{{ job.id }}/fee-paid"
      hx-target="#job-row-{{ job.id }}"
      hx-swap="outerHTML"
    >
      <input
        class="w-24 border rounded px-2 py-1 text-right"
        type="number"
        min="0"
        max="{{ job.fee_total }}"
        step="0.01"
        name="fee_paid"
        value="{{ '%.2f'|format(job.fee_paid) }}"
      />
      <button class="text-xs bg-slate-200 px-2 py-1 rounded">Save</button>
    </form>
  </td>
  <td class="p-3 text-right font-semibold {% if job.fee_outstanding > 0 %}text-red-700{% else %}text-green-700{% endif %}">
    ₦{{ '%.2f'|format(job.fee_outstanding) }}
  </td>
  <td class="p-3 text-center">
    <button
      class="text-xs bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700"
      hx-delete="/jobs/{{ job.id }}"
      hx-target="#table-container"
      hx-swap="innerHTML"
      hx-confirm="Delete this job?"
    >
      Delete
    </button>
  </td>
</tr>
