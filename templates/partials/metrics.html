<div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
  <p class="text-sm text-slate-500">Total Active Jobs</p>
  <p class="text-2xl font-bold">{{ metrics.total_active_jobs }}</p>
</div>
<div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
  <p class="text-sm text-slate-500">Total Cash Collected</p>
  <p class="text-2xl font-bold text-green-700">₦{{ '%.2f'|format(metrics.total_cash_collected) }}</p>
</div>
<div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
  <p class="text-sm text-slate-500">Total Debt Owed</p>
  <p class="text-2xl font-bold text-red-700">₦{{ '%.2f'|format(metrics.total_debt_owed) }}</p>
</div>
